<!DOCTYPE html>
<html>
<head>
  <title>Missing Link</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Not black-translucent: iOS 26 blurs the page under a translucent bar. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Missing Link">
  <meta name="theme-color" content="#fff">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="images/icon-180.png">
  <link rel="icon" type="image/png" href="images/icon_blue.png">
  <link rel="stylesheet" href="https://code.jquery.com/ui/1.13.2/themes/base/jquery-ui.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
  <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@svgdotjs/svg.js@3.0/dist/svg.min.js"></script>
  <script src="javascript/string_to_png.js"></script>
  <script src="javascript/svg_to_png.js"></script>
  <script src="javascript/toggle.js"></script>
  <script src="javascript/shapes.js"></script>
  <script src="javascript/color.js"></script>
  <script src="javascript/graph.js"></script>
  <script src="javascript/mouse_handler.js"></script>
  <script src="javascript/confetti.js"></script>
  <script src="javascript/game.js"></script>
  <script src="javascript/level_picker.js"></script>
  <script src="javascript/colorpicker.js"></script>
  <script src="javascript/level_urls.js"></script>
  <script src="javascript/splashscreen.js"></script>
  <script src="javascript/viewport.js"></script>
  <script>
    // Opened from the Home Screen (see #topEdge).
    if (navigator.standalone || window.matchMedia("(display-mode: standalone)").matches) {
	document.documentElement.classList.add("standalone");
    }

    // Levels are made for a board at least BOARD_WIDTH pixels wide.  On a
    // narrower screen, the board (but not the buttons) is shrunk to fit, so
    // dots keep their size relative to the level (Game.setSize).
    const BOARD_WIDTH = 980;
    function boardScale() {
	return Math.min(1, window.innerWidth / BOARD_WIDTH);
    }

    const MIN_WIDTH = 500;
    const MAX_WIDTH = Math.min(1000, window.innerHeight - 250);
    var game;

    $(function() {
	var levelPickerContainer = document.getElementById('levelPicker');
	var gameContainer = document.getElementById('game');

	var width = window.innerWidth;
	var height = window.innerHeight;
	game = new Game(gameContainer, width, height, boardScale());
	const levelPicker = new LevelPicker(levelPickerContainer, game, LEVEL_URLS);

	drawSplashscreen();
    });

    window.addEventListener('resize', () => {
	game.resize(window.innerWidth, window.innerHeight, boardScale());
    });

    // iOS can leave the page shifted after a rotation, so taps miss the
    // buttons (viewport.js).
    keepPageInPlace();
  </script>

  <!-- Uncomment this to debug touch input:  
  <script src="https://cdn.jsdelivr.net/gh/hammerjs/touchemulator@master/touch-emulator.js"></script>
  <script>TouchEmulator();</script>
  ---->
  <style>
    /* The page never scrolls: the level picker scrolls inside itself. */
    html, body {
	height: 100%;
	margin: 0;
	background: var(--screen-color, #fff);
	overscroll-behavior: none;
    }
    body {
	overflow: hidden;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
    }
    textarea, input {
	-webkit-user-select: text;
	user-select: text;
    }
    #levelPicker {
	position: absolute;
	top: 0;
	bottom: 0;
	left: 0;
	right: 0;
	box-sizing: border-box;
	padding: calc(12px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right))
		 calc(8px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
	overflow-y: auto;
	overscroll-behavior: contain;
	touch-action: pan-y;
    }
    /* In a Home Screen app, iOS 26 blurs the top of the screen unless an
       opaque fixed box covers the top edge, and colors the status bar from
       it.  Keep it the color of the current screen (setScreenColor). */
    #topEdge {
	display: none;
    }
    html.standalone #topEdge {
	display: block;
	position: fixed;
	top: 0;
	left: 0;
	right: 0;
	height: 12px;
	background: var(--screen-color, #fff);
	/* Under jQuery UI's dialog backdrop (100), so it dims with the page. */
	z-index: 99;
    }
    .gameBackButton {
	top: calc(20px + env(safe-area-inset-top));
	left: calc(20px + env(safe-area-inset-left));
    }
    svg.graph {
	border: 0px;
	border-radius: 0;
	margin: 0;
	padding: 0;
	position: absolute;
	top: 0;
	left: 0;
	z-index: 0;
    }
    div.controls {
	width: 100%;
	margin: 0;
	padding: 0;
	position: absolute;
	bottom: 0;
	left: 0;
	background: none;
	border: none;
	pointer-events: none;
	box-shadow: none;
	box-sizing: border-box;
	padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    div.controls button {
	pointer-events: auto;
    }
    div.controls #gameEasyMode {
	pointer-events: auto;
    }
    div.levelTitle {
	position: absolute;
	pointer-events: none;
	top: calc(25px + env(safe-area-inset-top));
	left: 50%;
	/* Clear of the back button. */
	width: min(80%, calc(100% - 150px));
	transform: translate(-50%, 0);
	z-index: 100;
	text-shadow: 0px 0px 2px white;
    }
  </style>
</head>
<body class="fullscreen">
  <div id="topEdge"></div>
  <div id="splashscreen">
    <img src="images/titles/missing_link_black.jpg">
  </div>
  <div id="levelPicker">
    <img src="images/titles/title9.jpg" class="missingLinkTitle">
  </div>
  <div id="game" style="display: none"></div>
</body>
</html>
