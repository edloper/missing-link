<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- The game's icon (images/icon_blue.png), redrawn so it can be drawn at
       any size.  scripts/make_icons.cjs makes the PNG icons from it. -->
  <rect width="100" height="100" fill="#7092be"/>
  <g id="picture">
    <g stroke="#000" stroke-width="2.6" stroke-linecap="round" fill="none">
      <path d="M50 20L10 50L30 80L70 80L90 50Z"/>
      <path d="M30 80L50 20L70 80"/>
    </g>
    <g fill="#fff" stroke="#000" stroke-width="2.4">
      <circle cx="50" cy="20" r="4.6"/>
      <circle cx="10" cy="50" r="4.6"/>
      <circle cx="90" cy="50" r="4.6"/>
      <circle cx="30" cy="80" r="4.6"/>
      <circle cx="70" cy="80" r="4.6"/>
    </g>
  </g>
</svg>
